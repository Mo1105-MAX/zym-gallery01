<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ZYM工作室图集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f5f5;padding:20px;}
h1{text-align:center;color:#224477;margin-bottom:30px;}
.album{display:grid;grid-template-columns: repeat(auto-fill, minmax(240px,1fr));gap:16px;max-width:1200px;margin:0 auto;}
.album img{width:100%;border-radius:8px;box-shadow:0 2px 6px #00000022;cursor:pointer;transition:0.2s;}
.album img:hover{transform:scale(1.02);}
/* 放大弹窗样式 */
.lightbox{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain;}
</style>
</head>
<body>
<h1>ZYM工作室图集</h1>
<div class="album" id="album"></div>
<div class="lightbox" id="lb">
  <img id="lb-img">
</div>
<script>
const picList = [
"微信001/1.jpg",
"微信001/2.jpg",
"微信001/3.jpg",
"微信001/4.jpg",
"微信001/5.jpg",
"微信001/6.jpg",
"微信001/7.jpg",
"微信001/8.jpg",
"微信001/9.jpg",
"微信001/10.jpg",
"微信001/11.jpg",
"微信001/12.jpg",
"微信001/13.jpg",
"微信001/14.jpg",
"微信001/15.jpg",
"微信001/16.jpg",
"微信001/17.jpg",
"微信001/18.jpg",
"微信001/19.jpg",
"微信001/20.jpg"
];
const album = document.getElementById("album");
const lightbox = document.getElementById("lb");
const lbImg = document.getElementById("lb-img");

picList.forEach(url=>{
  const img = document.createElement("img");
  img.src = url;
  img.loading="lazy";
  // 点击图片放大
  img.onclick = ()=>{
    lbImg.src = url;
    lightbox.style.display = "flex";
  }
  album.appendChild(img);
})
// 点击黑色遮罩关闭大图
lightbox.onclick = ()=>{
  lightbox.style.display = "none";
  lbImg.src = "";
}
</script>
</body>
</html>
